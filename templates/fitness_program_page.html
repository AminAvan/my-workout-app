<!DOCTYPE html>
<html>
<head>
    <title>Fitness Programs of ExLive</title>
    <style>
        /* Add spacing to form elements */
        select {
            margin-bottom: 10px;
            margin-right: 15px;
        }
    </style>
    <script>
        function showSecondSubmitButton() {
          // Get a reference to the second submit button
          var secondSubmitButton = document.getElementById("second-submit-button");
    
          // Set the display style to "block" to show the button
          secondSubmitButton.style.display = "block";
        }
      </script>
</head>


<body>
    <h1 style="background-color: gold;">
        ExLive - Fitness Programs Recommender:
        <img src="/static/images/trainer.png" alt="Example Image" width="35" height="35" style="display: inline-block;">
    </h1>
    
    <p style="border: 1px solid yellowgreen; padding: 5px; font-size: 25;">
        To receive the workout program, please answer the following question about your exercise goal and then write an email requesting the program.
    </p>
    
    <form action="/fitnessprogram" method="POST">
        What is your exercise goal?
        <select name= fitprgrms>
            <option selected disabled>My goal is ...</option>
            {% for g in fit_programs %}
            <option value="{{g.excersiegoal}}">{{g.excersiegoal}}</option>
            {% endfor %}
        </select>
        <input type="submit" name="submit_button" value="Submit" onclick="showSecondSubmitButton()">
        <!-- {% with messages = get_flashed_messages(with_categories=true, category_filter='res_user_fitness_program') %}
            {% for category, message in messages %}
                <pre style="color: green; background-color: lightyellow; border: 1px solid greenyellow; padding: 5px; font-size: 14px;">{{ message }}</pre>
            {% endfor %}
        {% endwith %} -->
    </form>
    <form action="/fitnessprogram" method="POST">
        <input type="submit" id="second-submit-button" name="submit2" value="Submit 2" style="display: none;">
    </form>
    <br>
    
    <a href="{{url_for('user_dashboard')}}">
        Dashboard
        <img src="/static/images/dashboard.png" alt="Example Image" width="35" height="35" style="display: inline-block;">
    </a>
    <br>
    <br>
    <a href="{{url_for('user_bmi')}}">
        Calculate BMI
        <img src="/static/images/bmi.png" alt="Example Image" width="35" height="35" style="display: inline-block;">
    </a>
    <br>
    <br>
    <a href="{{url_for('user_signout')}}">
        Sign Out
        <img src="/static/images/signout.png" alt="Example Image" width="35" height="35" style="display: inline-block;">
    </a>
</body>
</html>
